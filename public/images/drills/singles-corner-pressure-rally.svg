<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Singles corner pressure rally</title><desc id="desc">A singles court with a two-shot path moving the opponent from one corner into another.</desc>
  <rect width="900" height="600" rx="36" fill="#eaf4ff"/><rect x="285" y="45" width="330" height="510" rx="8" fill="#0c7184" stroke="#08254b" stroke-width="8"/>
  <g stroke="#fff" stroke-width="5" fill="none"><path d="M285 300h330M285 145h330M285 455h330M365 45v510M535 45v510"/><path stroke-dasharray="12 10" d="M450 45v510"/></g>
  <circle cx="340" cy="95" r="30" fill="#ffb703" opacity=".85"/><circle cx="560" cy="235" r="30" fill="#ffb703" opacity=".85"/><path d="M450 390Q365 250 340 115" fill="none" stroke="#ffb703" stroke-width="11" marker-end="url(#a)"/><path d="M350 110Q470 120 550 215" fill="none" stroke="#5ecbff" stroke-width="11" marker-end="url(#b)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffb703"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5ecbff"/></marker></defs>
  <text x="35" y="90" font-family="Arial" font-size="28" font-weight="700" fill="#08254b">MOVE, THEN OPEN</text><text x="35" y="128" font-family="Arial" font-size="21" fill="#365a7d">change corner from balance</text>
</svg>
