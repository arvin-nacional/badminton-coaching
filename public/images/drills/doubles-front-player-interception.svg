<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Doubles front-player interception</title><desc id="desc">Front-back attacking formation with the front player moving laterally to intercept a flat return.</desc>
  <rect width="900" height="600" rx="36" fill="#edf8f5"/><rect x="285" y="45" width="330" height="510" rx="8" fill="#177c65" stroke="#08254b" stroke-width="8"/>
  <g stroke="#fff" stroke-width="5" fill="none"><path d="M285 300h330M285 145h330M285 455h330M365 45v510M535 45v510"/><path stroke-dasharray="12 10" d="M450 45v510"/></g>
  <circle cx="450" cy="500" r="18" fill="#5ecbff"/><circle cx="420" cy="345" r="18" fill="#ffb703"/><path d="M450 480Q500 355 475 190" fill="none" stroke="#5ecbff" stroke-width="11" marker-end="url(#a)"/><path d="M420 345Q500 330 535 275" fill="none" stroke="#ffb703" stroke-width="12" marker-end="url(#b)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5ecbff"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffb703"/></marker></defs>
  <text x="28" y="86" font-family="Arial" font-size="26" font-weight="700" fill="#08254b">FRONT PLAYER OWNS</text><text x="28" y="122" font-family="Arial" font-size="21" fill="#365a7d">net + midcourt interceptions</text>
</svg>
