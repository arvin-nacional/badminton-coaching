<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Doubles first four shots</title><desc id="desc">Four numbered arrows show serve, return, third shot and fourth shot in doubles.</desc>
  <rect width="900" height="600" rx="36" fill="#edf8f5"/><rect x="285" y="45" width="330" height="510" rx="8" fill="#177c65" stroke="#08254b" stroke-width="8"/>
