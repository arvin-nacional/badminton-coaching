  <g fill="none" stroke="#ffb703" stroke-width="10" marker-end="url(#a)"><path d="M390 405Q410 330 430 285"/><path d="M430 275Q510 340 530 395"/><path d="M530 390Q485 315 470 285"/><path d="M470 275Q390 335 365 390"/></g>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#ffb703"/></marker></defs>
