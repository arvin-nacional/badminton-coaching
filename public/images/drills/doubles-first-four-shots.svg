  <text x="35" y="90" font-family="Arial" font-size="28" font-weight="700" fill="#08254b">FIRST FOUR SHOTS</text><text x="35" y="128" font-family="Arial" font-size="21" fill="#365a7d">serve · return · third · fourth</text>
</svg>
