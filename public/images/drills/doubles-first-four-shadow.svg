<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Doubles first-four-shot shadow</title><desc id="desc">Two home shadow sequences rehearse serve and third shot, then return and fourth shot.</desc>
