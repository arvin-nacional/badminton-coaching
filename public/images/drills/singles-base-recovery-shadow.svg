<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Singles base recovery shadow</title><desc id="desc">A home shadow pattern connecting serve, singles base and four corner movements.</desc>
  <rect width="900" height="600" rx="36" fill="#eaf4ff"/><circle cx="470" cy="330" r="44" fill="#5ecbff"/><g fill="#ffb703"><circle cx="330" cy="155" r="28"/><circle cx="610" cy="155" r="28"/><circle cx="330" cy="500" r="28"/><circle cx="610" cy="500" r="28"/></g>
  <g stroke="#08254b" stroke-width="11" stroke-linecap="round" marker-end="url(#a)"><path d="M445 300L345 175"/><path d="M495 300L595 175"/><path d="M440 360L345 480"/><path d="M500 360L595 480"/></g><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5-9 4.5z" fill="#08254b"/></marker></defs>
  <text x="45" y="78" font-family="Arial" font-size="31" font-weight="700" fill="#08254b">SERVE · BASE · CORNER</text><text x="45" y="116" font-family="Arial" font-size="22" fill="#365a7d">recover twice in every pattern</text>
